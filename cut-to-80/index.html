<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cut to 80</title>
<meta name="theme-color" content="#d63a0b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Cut to 80">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE: a coach's logbook — blunt, numeric, zero fluff
   IDEA: the gym weigh-in card: huge scale numbers and a ruler running start → goal
   PICTURE: the orange hero band — trend weight, progress ring, milestone ruler
   COLOUR and TYPE: signal-orange field, ink, white; Barlow Condensed numerals, Inter text
   LAYOUT: one mobile column, bottom tab bar, cards pair up in a 2-column grid */
:root{--bg:#f2f2ef;--card:#fff;--ink:#141416;--mut:#606066;--line:#e2e2de;--acc:#e8461a;--hero:#d63a0b;--soft:#fff0ea;--field:#f7f7f5;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0e0e10;--card:#18181b;--ink:#f1f1ee;--mut:#a3a3a9;--line:#2c2c31;--acc:#ff6a3d;--hero:#c9370b;--soft:#2b1710;--field:#111114;color-scheme:dark}}
:root[data-theme=dark]{--bg:#0e0e10;--card:#18181b;--ink:#f1f1ee;--mut:#a3a3a9;--line:#2c2c31;--acc:#ff6a3d;--hero:#c9370b;--soft:#2b1710;--field:#111114;color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html{-webkit-text-size-adjust:100%;scroll-padding-top:72px}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Inter,system-ui,-apple-system,sans-serif;overflow-x:clip;padding-bottom:calc(86px + env(safe-area-inset-bottom))}
.num{font-family:'Barlow Condensed',Inter,sans-serif;font-weight:700;font-variant-numeric:tabular-nums}
.wrap{max-width:780px;margin:0 auto;padding:0 16px}
button{font-family:inherit}
header.top{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;gap:10px;height:58px}
.brand{font:700 26px/1 'Barlow Condensed',Inter,sans-serif;color:var(--ink);text-decoration:none}
.brand b{color:var(--acc)}
.sync{margin-left:auto;font-size:13px;color:var(--mut);display:flex;align-items:center;gap:6px;white-space:nowrap}
.sync i{width:8px;height:8px;border-radius:50%;border:2px solid var(--mut)}
.sync.ok i{background:var(--ink);border-color:var(--ink)}
.sync.saving i{background:var(--acc);border-color:var(--acc)}
.sync.err{color:var(--acc)}
.iconbtn{width:44px;height:44px;flex:none;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);display:grid;place-items:center;cursor:pointer;padding:0}
.iconbtn:disabled{opacity:.35;cursor:default}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.hero{background:var(--hero);color:#fff}
.hero .wrap{padding-top:22px;padding-bottom:18px}
.hgrid{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;align-items:center}
.hlab{font-size:15px;font-weight:600}
.big{font-size:clamp(72px,21vw,118px);line-height:.86;margin-top:4px}
.big small{font-size:.3em;margin-left:6px;font-weight:600}
.hsub{font-size:16px;margin-top:10px}
.ring{width:124px;height:124px}
.ringv.anim{animation:ring 1.1s cubic-bezier(.2,.7,.2,1)}
@keyframes ring{from{stroke-dashoffset:314.16}}
@media (prefers-reduced-motion:reduce){.ringv.anim{animation:none}}
.ruler{position:relative;margin:22px 6px 4px;height:46px}
.ruler .tr,.ruler .fl{position:absolute;left:0;top:10px;height:6px;border-radius:3px}
.ruler .tr{right:0;background:rgba(255,255,255,.3)}
.ruler .fl{background:#fff}
.ruler .nt{position:absolute;top:5px;width:2px;height:16px;background:rgba(255,255,255,.75);margin-left:-1px}
.ruler .nl{position:absolute;top:26px;font:700 17px/1 'Barlow Condensed',sans-serif;transform:translateX(-50%)}
.ruler .nl.first{transform:none}.ruler .nl.last{transform:translateX(-100%)}
.ruler .mk{position:absolute;top:2px;width:22px;height:22px;border-radius:50%;background:#fff;border:5px solid var(--hero);box-shadow:0 0 0 2px #fff;transform:translateX(-50%)}
.hfoot{font-size:15px;display:flex;flex-wrap:wrap;gap:4px 16px;margin-top:6px}
.sec{padding-top:18px;padding-bottom:6px}
.h2{font:700 24px/1.1 'Barlow Condensed',Inter,sans-serif;margin:0 0 10px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.span2{grid-column:1/-1}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}
.card h3{margin:0 0 4px;font-size:14px;font-weight:600;color:var(--mut)}
.val{font-size:32px;line-height:1}
.val small{font:500 15px Inter,sans-serif;color:var(--mut)}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;background:var(--ink);border-radius:4px}
.bar i.over{background:var(--acc)}
.muted{color:var(--mut)}.sm{font-size:14px}
.mt{margin-top:10px}.mt2{margin-top:18px}
.btn{min-height:44px;padding:0 16px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:600 15px Inter,sans-serif;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;white-space:nowrap}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.ink{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.btn.wide{width:100%}
.btn:disabled{opacity:.5;cursor:default}
input,select,textarea{font:16px Inter,sans-serif;color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:10px;min-height:44px;padding:8px 12px;width:100%}
input[type=checkbox]{width:22px;height:22px;min-height:0;accent-color:var(--acc)}
textarea{min-height:84px;resize:vertical}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
label.f{display:block;font-size:14px;font-weight:600;margin:10px 0 4px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row>input,.row>select{flex:1 1 120px}
.end{justify-content:flex-end}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 12px}
@media(max-width:480px){.g2{grid-template-columns:minmax(0,1fr)}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}.g3>.card:last-child{grid-column:1/-1}}
.seg{display:flex;background:var(--field);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;min-height:40px;border:0;border-radius:9px;background:none;color:var(--mut);font:600 14px Inter,sans-serif;cursor:pointer;padding:0 6px}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.14)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.chip{flex:none;min-height:40px;padding:0 14px;border-radius:20px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:500 14px Inter,sans-serif;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav.tabs .wrap{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));padding:0 4px}
nav.tabs a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 9px;color:var(--mut);text-decoration:none;font-size:13px;font-weight:600;min-height:58px}
nav.tabs a.on{color:var(--acc)}
nav.tabs svg{width:24px;height:24px}
.datebar{display:flex;align-items:center;gap:8px;justify-content:space-between;margin-bottom:12px}
.datebar .d{font:700 24px/1.05 'Barlow Condensed',sans-serif;text-align:center}
.alert{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 8px;padding:12px 8px 12px 14px;border-radius:14px;background:var(--card);border:1px solid var(--line);margin-bottom:8px}
.alert.warn{background:var(--soft);border-color:transparent}
.alert b{display:block;font-size:15px}
.alert p{margin:2px 0 0;font-size:14px;color:var(--mut)}
.alert .acts{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap}
.lvl{font-size:13px;font-weight:600;color:var(--acc)}
.x{border:0;background:none;color:var(--mut);width:40px;height:40px;cursor:pointer;display:grid;place-items:center}
.list{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.li{display:flex;align-items:center;gap:10px;padding:10px 14px;border-top:1px solid var(--line);min-height:58px;width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;color:inherit;font:inherit}
.li:first-child{border-top:0}
button.li,.lib{cursor:pointer}
.lib{background:none;border:0;text-align:left;color:inherit;font:inherit;padding:4px 0;min-height:44px}
.grow{flex:1}
.nm{font-weight:600;font-size:15px}
.meta{font-size:14px;color:var(--mut)}
.k{font:700 21px 'Barlow Condensed',sans-serif;white-space:nowrap;text-align:right}
.k small{font:500 13px Inter;color:var(--mut)}
.star{border:0;background:none;width:40px;height:44px;display:grid;place-items:center;color:var(--line);cursor:pointer;flex:none;padding:0}
.star svg{fill:currentColor;stroke:none;width:22px;height:22px}
.star.on{color:var(--acc)}
.mealh{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin:16px 2px 6px}
.mealh b{font:700 20px 'Barlow Condensed',sans-serif}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:9px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{color:var(--mut);font-weight:600}
.scroll{overflow-x:auto}
.fig{position:relative;height:300px}
.fig>svg{position:absolute;inset:0;width:100%;height:100%}
.fig .gl{stroke:var(--line)}
.fig .tk{fill:var(--mut);font:13px Inter,sans-serif}
.fig .goal{stroke:var(--acc);stroke-width:1.5;stroke-dasharray:3 4}
.fig .gt{fill:var(--acc);font:600 13px Inter,sans-serif}
.fig .plan{fill:none;stroke:var(--mut);stroke-width:1.5;stroke-dasharray:6 5}
.fig .pt{fill:var(--mut);opacity:.6}
.fig .trend{fill:none;stroke:var(--acc);stroke-width:3;stroke-linejoin:round;stroke-linecap:round}
.fig .tdot{fill:var(--acc);stroke:var(--card);stroke-width:2}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--mut);margin-top:6px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{display:inline-block;width:18px;height:0;border-top:3px solid var(--acc)}
.legend i.p{border-top:2px dashed var(--mut)}
.legend i.d{width:7px;height:7px;border:0;border-radius:50%;background:var(--mut)}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.wd{border:1px solid var(--line);border-radius:12px;padding:7px 1px;text-align:center;background:var(--card);font-size:13px;cursor:pointer;color:var(--ink);min-height:56px}
.wd b{display:block;font:700 16px 'Barlow Condensed',sans-serif}
.wd.on{box-shadow:inset 0 0 0 2px var(--acc);border-color:var(--acc)}
.wd.done{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.ex{margin-top:10px}
.ex .hd{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.ex .hint{font-size:14px;color:var(--mut);margin-top:2px}
.ex .hint.up{color:var(--acc);font-weight:600}
.set{display:grid;grid-template-columns:30px minmax(0,1fr) minmax(0,1fr) 50px;gap:8px;align-items:center;margin-top:8px}
.set .n{font:700 19px 'Barlow Condensed',sans-serif;color:var(--mut);text-align:center}
.tick{width:50px;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--field);color:var(--mut);cursor:pointer;display:grid;place-items:center;padding:0}
.tick.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.qty{display:flex;align-items:center;justify-content:center;gap:18px;margin:14px 0}
.qv{font-size:52px;min-width:90px;text-align:center;line-height:1}
.sum{text-align:center;font-weight:600;margin:10px 0 14px}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.badge{border:1px dashed var(--line);border-radius:14px;padding:10px 12px;color:var(--mut);font-size:14px}
.badge.got{border:1px solid var(--ink);color:var(--ink);background:var(--card)}
.badge b{display:block;font:700 20px 'Barlow Condensed',sans-serif}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px}
.ph{position:relative;border-radius:12px;overflow:hidden;background:var(--line);aspect-ratio:3/4;margin:0}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph figcaption{position:absolute;left:6px;bottom:6px;background:rgba(0,0,0,.62);color:#fff;font-size:13px;padding:1px 7px;border-radius:6px}
.ph button{position:absolute;right:4px;top:4px;width:36px;height:36px;border-radius:10px;border:0;background:rgba(0,0,0,.55);color:#fff;cursor:pointer;display:grid;place-items:center}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.chat{display:flex;flex-direction:column;gap:8px;margin:10px 0}
.bub{padding:10px 12px;border-radius:14px;max-width:90%;white-space:pre-wrap;font-size:15px}
.bub.u{align-self:flex-end;background:var(--ink);color:var(--bg)}
.bub.a{align-self:flex-start;background:var(--field);border:1px solid var(--line)}
.out{white-space:pre-wrap;font-size:15px;line-height:1.6;margin-top:10px}
.upd{background:var(--ink);color:var(--bg);border-radius:16px;padding:14px;margin-bottom:10px}
.upd p{margin:4px 0 10px;font-size:14px;opacity:.85}
.upd .btn{background:var(--bg);color:var(--ink);border-color:var(--bg)}
.kv{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;font-size:15px}
.kv dt{color:var(--mut)}.kv dd{margin:0;text-align:right;font-weight:600;white-space:nowrap}
details summary{cursor:pointer;font-weight:600;min-height:44px;display:flex;align-items:center}
.note{font-size:14px;color:var(--mut);margin:14px 2px}
#modal{position:fixed;inset:0;z-index:50;display:none;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.5)}
#modal.open{display:flex}
#modal .sheet{background:var(--card);width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom));max-height:90vh;overflow:auto}
@media(min-width:700px){#modal{align-items:center}#modal .sheet{border-radius:20px}}
#toast{position:fixed;left:50%;bottom:calc(98px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--bg);padding:8px 10px 8px 16px;border-radius:12px;display:none;align-items:center;gap:12px;width:max-content;max-width:92vw;font-size:15px;box-shadow:0 8px 26px rgba(0,0,0,.28)}
#toast.show{display:flex}
#toast button{background:none;border:0;color:var(--acc);font:700 15px Inter,sans-serif;min-height:40px;cursor:pointer}
.empty{padding:18px;text-align:center;color:var(--mut);font-size:15px}
.cal{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:5px}
.cd{border:1px solid var(--line);border-radius:10px;padding:5px 1px;background:var(--card);color:var(--ink);font-size:13px;line-height:1.15;min-height:50px;cursor:pointer;text-align:center;overflow:hidden;white-space:nowrap}
.cd b{display:block;font:700 18px/1.1 'Barlow Condensed',sans-serif}
.cd.done{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.cd.miss{color:var(--acc);border-color:var(--acc)}
.cd.on{box-shadow:inset 0 0 0 2px var(--acc);border-color:var(--acc)}
.cd:disabled{opacity:.45;cursor:default}
.set.bw{grid-template-columns:30px minmax(0,1fr) 50px}
.chk{display:flex;align-items:center;gap:12px;width:100%;min-height:50px;padding:8px 2px;border:0;border-top:1px solid var(--line);background:none;color:inherit;font:inherit;text-align:left;cursor:pointer}
.chk:first-child{border-top:0}
.chk .bx{width:28px;height:28px;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center;flex:none;color:transparent}
.chk.on .bx{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chk .bx svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.chk small{color:var(--mut);font-size:14px;margin-left:auto;white-space:nowrap;padding-left:8px}
.chk.on .grow{text-decoration:line-through;text-decoration-color:var(--mut)}
.phase{padding:8px 0;border-top:1px solid var(--line)}.phase:first-child{border-top:0}
.phase.now b{color:var(--acc)}
ul.tips{margin:6px 0 0;padding-left:20px}ul.tips li{margin:4px 0}
.vh{position:absolute;left:0;top:0;width:1px;height:1px;opacity:0;overflow:hidden;clip:rect(0 0 0 0);pointer-events:none}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <a class="brand" id="brand" href="#today">Cut to <b>80</b></a>
  <span class="sync" id="sync"><i></i><span>Loading</span></span>
  <a class="iconbtn" href="#profile" aria-label="Profile and data"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg></a>
</div></header>
<main id="app"></main>
<nav class="tabs" hidden><div class="wrap">
  <a href="#today" data-v="today"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="3.5"/></svg>Today</a>
  <a href="#food" data-v="food"><svg class="i" viewBox="0 0 24 24"><path d="M3 11h18a9 8 0 0 1-18 0z"/><path d="M9 7c0-2 2-2 2-4M14 7c0-2 2-2 2-4"/></svg>Food</a>
  <a href="#workout" data-v="workout"><svg class="i" viewBox="0 0 24 24"><path d="M6.5 7v10M3.5 9.5v5M17.5 7v10M20.5 9.5v5M6.5 12h11"/></svg>Workout</a>
  <a href="#progress" data-v="progress"><svg class="i" viewBox="0 0 24 24"><path d="M4 4v16h16"/><path d="M8 15l4-4 3 3 5-6"/></svg>Progress</a>
  <a href="#coach" data-v="coach"><svg class="i" viewBox="0 0 24 24"><path d="M4 5h16v11H10l-6 4z"/></svg>Coach</a>
</div></nav>
<div id="modal"></div>
<div id="toast" role="status" aria-live="polite"></div>
<script>
{
'use strict';
/* ---------- utils ---------- */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const r1=x=>Math.round(x*10)/10;
const nf=(n,d=0)=>(n==null||!isFinite(n))?'–':Number(n).toLocaleString('en-IN',{minimumFractionDigits:d,maximumFractionDigits:d});
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const clone=o=>JSON.parse(JSON.stringify(o));
const mean=a=>a.length?a.reduce((s,x)=>s+x,0)/a.length:null;
const pad=n=>String(n).padStart(2,'0');
const dkey=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const pk=k=>{const p=k.split('-').map(Number);return new Date(p[0],p[1]-1,p[2])};
const addD=(k,n)=>{const d=pk(k);d.setDate(d.getDate()+n);return dkey(d)};
const dd=(a,b)=>Math.round((pk(b)-pk(a))/864e5);
const today=()=>dkey(new Date());
const dow=k=>pk(k).getDay();
const monOf=k=>addD(k,-((dow(k)+6)%7));
const fD=(k,o)=>pk(k).toLocaleDateString('en-IN',o||{day:'numeric',month:'short'});

const ST={db:null,dirty:new Set(),timers:{},busy:{},again:{},retry:{}};

function localLoad(){try{const o=JSON.parse(localStorage.getItem(LKEY)||'null');if(o){S.profile=o.profile?Object.assign(DEF(),o.profile):null;S.days={};for(const k in (o.days||{}))S.days[k]=norm(k,o.days[k])}}catch(e){}}
function localSave(){try{localStorage.setItem(LKEY,JSON.stringify({profile:S.profile,days:S.days}))}catch(e){toast('Could not save on this device.')}}
function docData(path){const p=path.split('/');if(p[0]==='app')return S.profile;if(p[0]==='days')return S.days[p[1]]||null;return null}
function persist(path){
  S.ver++;
  if(S.mode!=='db'){localSave();return}
  if(S.readOnly)return;
  ST.dirty.add(path);setSync('saving');
  clearTimeout(ST.timers[path]);
  ST.timers[path]=setTimeout(()=>flush(path),450);
}
async function flush(path){
  if(ST.busy[path]){ST.again[path]=true;return}
  ST.busy[path]=true;
  const data=docData(path);let failed=false;
  try{if(data)await ST.db.doc(path).set(clone(data));else await ST.db.doc(path).delete();ST.retry[path]=0}
  catch(e){failed=true;writeErr(e,path)}
  ST.busy[path]=false;
  if(ST.again[path]){ST.again[path]=false;flush(path);return}
  if(!failed)ST.dirty.delete(path);
  if(!ST.dirty.size)setSync('ok');
}
function writeErr(e,path){

}

  if(adds.length){const addK=adds.reduce((a,[id,q])=>a+FB[id].kcal*q,0);out=pick(Math.max(0.6,(T.kcal-addK)/T.kcal));
    for(const [id,q,slot] of adds){const f=FB[id];out.find(m=>m.s===slot).items.push({fid:id,name:f.name,unit:f.unit,qty:q,kcal:f.kcal,p:f.p,c:f.c,f:f.f})}
    const STAPLE=['chapati','jbhakri','rice','poha','upma','oats','idli','bread','khichdi','banana','apple'];
    for(let g=0;g<10;g++){const all=out.flatMap(m=>m.items);if(tot({foods:all}).k<=T.kcal*1.03)break;let best=null;for(const it of all){if(!STAPLE.includes(it.fid))continue;const st=/piece|medium|slice/.test(it.unit)?1:0.5;if(it.qty-st<st)continue;if(!best||it.qty*it.kcal>best.qty*best.kcal)best=Object.assign(it,{_st:st})}if(!best)break;best.qty-=best._st;delete best._st}
    out.forEach(m=>m.items.forEach(i=>{delete i._st}));
    note='Protein boosters added: '+adds.map(([id])=>FB[id].name.toLowerCase()).join(', ')+'. No whey? Use 1 vati soya chunks or 4 egg whites.'}
  return {meals:out,note,T};
}
function grocery(){
  const agg={};
  for(let w=0;w<7;w++)for(const m of buildPlan(w).meals)for(const it of m.items){const g=GRO[it.fid];if(g){for(const [n,a,u] of g){const key=n+'|'+u;agg[key]=(agg[key]||0)+a*it.qty}}else{const key=it.name+'|× '+it.unit;agg[key]=(agg[key]||0)+it.qty}}
  return Object.entries(agg).map(([k,v])=>{const [n,u]=k.split('|');let s;if(u==='g')s=v>=1000?nf(v/1000,1)+' kg':nf(Math.ceil(v/50)*50)+' g';else if(u==='ml')s=v>=1000?nf(v/1000,1)+' L':nf(v)+' ml';else if(u==='pcs'||u==='slices')s=nf(Math.ceil(v))+' '+u;else s=qtyTxt(Math.round(v*2)/2)+' '+u;return [n,s]}).sort((a,b)=>a[0].localeCompare(b[0]));
}

function drawWeight(svg){
  const W=svg.clientWidth,H=svg.clientHeight;if(!W||!H)return;
  const P=S.profile,r=ser(),t=today();if(!r.pts.length){svg.innerHTML='';return}
  let x0,x1=r.last>t?r.last:t;
  if(S.range==='all'){x0=r.first<P.startDate?r.first:P.startDate;const pg=planGoal();if(pg>x1)x1=pg}
  else{x0=addD(t,-(+S.range)+1);if(r.first>x0)x0=r.first}
  if(dd(x0,x1)<6)x1=addD(x0,6);
  const pts=r.pts.filter(p=>p.k>=x0&&p.k<=x1),tr=r.tr.filter(p=>p.k>=x0&&p.k<=x1);
  const ps=P.startDate>x0?P.startDate:x0,pg=planGoal(),plan=[];if(ps<=x1){plan.push({k:ps,w:planAt(ps)});if(pg>ps&&pg<x1)plan.push({k:pg,w:planAt(pg)});plan.push({k:x1,w:planAt(x1)})}
  const ys=pts.map(p=>p.w).concat(tr.map(p=>p.t),plan.map(p=>p.w));if(S.range==='all')ys.push(P.goalWeight);
  let y0=Math.floor(Math.min(...ys)-0.5),y1=Math.ceil(Math.max(...ys)+0.5);if(y1-y0<4){const m=(y0+y1)/2;y0=Math.floor(m-2);y1=Math.ceil(m+2)}
  const nar=W<520,ml=nar?30:40,mr=12,mt=16,mb=28,span=Math.max(1,dd(x0,x1));
  const XX=k=>ml+(W-ml-mr)*dd(x0,k)/span,Y=v=>mt+(H-mt-mb)*(1-(v-y0)/(y1-y0));
  const st=(y1-y0)<=8?1:(y1-y0)<=16?2:5;let g='';
  for(let v=Math.ceil(y0/st)*st;v<=y1;v+=st)g+=`<line x1="${ml}" x2="${W-mr}" y1="${Y(v).toFixed(1)}" y2="${Y(v).toFixed(1)}" class="gl"/><text x="${ml-6}" y="${(Y(v)+4).toFixed(1)}" text-anchor="end" class="tk">${v}</text>`;
  const n=nar?2:4;for(let i=0;i<=n;i++){const k=addD(x0,Math.round(span*i/n));g+=`<text x="${XX(k).toFixed(1)}" y="${H-8}" text-anchor="${i===0?'start':i===n?'end':'middle'}" class="tk">${esc(fD(k))}</text>`}
  if(P.goalWeight>=y0&&P.goalWeight<=y1)g+=`<line x1="${ml}" x2="${W-mr}" y1="${Y(P.goalWeight).toFixed(1)}" y2="${Y(P.goalWeight).toFixed(1)}" class="goal"/><text x="${ml+6}" y="${(Y(P.goalWeight)-6).toFixed(1)}" class="gt">Goal ${P.goalWeight} kg</text>`;
  if(plan.length>1)g+=`<polyline points="${plan.map(p=>XX(p.k).toFixed(1)+','+Y(p.w).toFixed(1)).join(' ')}" class="plan"/>`;
  const rad=pts.length>120?2:3.2;g+=pts.map(p=>`<circle cx="${XX(p.k).toFixed(1)}" cy="${Y(p.w).toFixed(1)}" r="${rad}" class="pt"/>`).join('');
  if(tr.length>1)g+=`<polyline points="${tr.map(p=>XX(p.k).toFixed(1)+','+Y(p.t).toFixed(1)).join(' ')}" class="trend"/>`;
  if(tr.length){const l=tr[tr.length-1];g+=`<circle cx="${XX(l.k).toFixed(1)}" cy="${Y(l.t).toFixed(1)}" r="5.5" class="tdot"/>`}
  svg.innerHTML=g;
}

let M=null,MR=null,tT=null;
function toast(msg,undo){const t=$('#toast');t.innerHTML='';const s=document.createElement('span');s.textContent=msg;t.appendChild(s);if(undo){const b=document.createElement('button');b.textContent='Undo';b.onclick=()=>{t.classList.remove('show');undo()};t.appendChild(b)}t.classList.add('show');clearTimeout(tT);tT=setTimeout(()=>t.classList.remove('show'),undo?7000:3200)}
function openModal(html){const m=$('#modal');m.innerHTML=`<div class="sheet" role="dialog" aria-modal="true">${html}</div>`;m.classList.add('open')}
function closeM(){const m=$('#modal');m.classList.remove('open');m.innerHTML='';M=null;if(MR){const r=MR;MR=null;r(false)}if(pend){pend=false;render()}}
function ask(title,text,ok){return new Promise(res=>{MR=res;openModal(`<h2 class="h2">${esc(title)}</h2><p>${esc(text)}</p><div class="row end mt2"><button class="btn" data-m="no">Cancel</button><button class="btn pri" data-m="yes">${esc(ok)}</button></div>`)})}

  else{const f=byId(o.fid);if(!f)return;M={fid:f.id,name:f.name,unit:f.unit,kcal:f.kcal,p:f.p,c:f.c,f:f.f,qty:1,meal:autoMeal()}}

  <div class="qty"><button class="iconbtn" data-m="dec" aria-label="Less">−</button><div class="num qv" id="mq">${qtyTxt(M.qty)}</div><button class="iconbtn" data-m="inc" aria-label="More">+</button></div>

/* ---------- actions ---------- */
function go(v){if(!VIEWS.includes(v))v='today';if(location.hash.slice(1)!==v)location.hash=v;else{S.view=v;render();window.scrollTo(0,0)}}
window.addEventListener('hashchange',()=>{const v=location.hash.slice(1);S.view=VIEWS.includes(v)?v:'today';render();window.scrollTo(0,0)});
const ensureWk=(d,k)=>{d.wk=d.wk||{key:sessKey(k)==='pre'?'rest':sessKey(k),sets:{}};d.wk.key=d.wk.key||sessKey(k);d.wk.sets=d.wk.sets||{}};
function curAll(k){const sd=sessDef(sessKey(k),k);return sd.kind==='strength'?sd.ex.concat(sd.core||[]):[]}
function blk(id){const k=S.sel,sd=sessDef(sessKey(k),k);editDay(k,d=>{ensureWk(d,k);d.wk.blocks=d.wk.blocks||{};d.wk.blocks[id]=!d.wk.blocks[id];if(sd.kind==='blocks'){const need=sd.blocks.filter(b=>!b.opt);d.wk.done=need.length>0&&need.every(b=>d.wk.blocks[b.id]||autoBlk(b.id,d))||!!d.wk.manual}});const d=S.days[k];if(d.wk&&d.wk.done&&sd.kind==='blocks'&&S.wkToast!==k){S.wkToast=k;toast('Session complete. Well done.')}}
const allDone=(d,all)=>all.length>0&&all.every(x=>((d.wk.sets[x.id]||[]).slice(0,x.sets).filter(s=>s&&s.ok).length>=x.sets));
function tick(ex,i){const k=S.sel,all=curAll(k),def=all.find(x=>x.id===ex),last=lastSets(ex,k);
  editDay(k,d=>{ensureWk(d,k);const a=d.wk.sets[ex]=d.wk.sets[ex]||[];while(a.length<=i)a.push({});const s=a[i]||(a[i]={});s.ok=!s.ok;
    if(s.ok){if(s.r==null||s.r==='')s.r=topRep(def&&def.reps);if((s.w==null||s.w==='')&&last){const lw=(last[i]&&last[i].w)||(last.find(z=>z&&z.w)||{}).w;if(lw)s.w=lw}}
    d.wk.done=allDone(d,all)||!!d.wk.manual});
  const d=S.days[k];if(d.wk&&d.wk.done&&S.wkToast!==k){S.wkToast=k;toast('Workout complete. Now the cardio.')}
}
function setVal(ex,i,f,v){editDay(S.sel,d=>{ensureWk(d,S.sel);const a=d.wk.sets[ex]=d.wk.sets[ex]||[];while(a.length<=i)a.push({});if(!a[i])a[i]={};a[i][f]=v===''?null:clamp(+v,0,999)},true)}
function alertAct(a){const t=today();
  if(a==='goweigh'){S.sel=t;go('today');setTimeout(()=>{const el=$('#wIn');if(el){el.focus();el.scrollIntoView({block:'center'})}},80)}
  else if(a==='cut150'){S.dismissed.add('plateau'+t);logTarget('Plateau fix: −150 kcal',p=>{p.adjKcal=(p.adjKcal||0)-150})}
  else if(a==='steps2k'){S.dismissed.add('plateau'+t);logTarget('Plateau fix: +2,000 steps',p=>{p.stepsBonus=(p.stepsBonus||0)+2000})}
  else if(a==='add150'){S.dismissed.add('fast'+t);logTarget('Losing too fast: +150 kcal',p=>{p.adjKcal=(p.adjKcal||0)+150})}
  else if(a==='plan'){S.ftab='plan';go('food')}
  else if(a==='logy'){S.sel=addD(t,-1);S.ftab='log';go('food')}
  else if(a==='water')editDay(t,d=>{d.water=(d.water||0)+1});

  const f=e.target,t=f.dataset&&f.dataset.form;if(!t)return;e.preventDefault();
  if(t==='weight'){const w=r1(+f.elements.w.value);if(!(w>=30&&w<=300)){toast('Enter your weight in kg.');return}editDay(S.sel,d=>{d.weight=w});toast('Weight saved: '+nf(w,1)+' kg')}
  else if(t==='onboard'){const [o,bad]=readPF(f);if(bad){toast(bad);return}S.profile=Object.assign(DEF(),o);persist('app/profile');if(!(day(o.startDate).weight>0)){S.days[o.startDate]=Object.assign(day(o.startDate),{weight:o.startWeight});persist('days/'+o.startDate)}S.sel=today();location.hash='today';S.view='today';render();toast('Plan started. Weigh in every morning.')}
  else if(t==='profile'){const [o,bad]=readPF(f);if(bad){toast(bad);return}const old=targets(today()).kcal;editProfile(p=>{Object.assign(p,o)});const nk=targets(today()).kcal;if(nk!==old)editProfile(p=>{p.targetLog=[{date:today(),oldK:old,newK:nk,reason:'Profile updated'}].concat(p.targetLog||[]).slice(0,30)},true);toast('Profile saved · target '+nf(nk)+' kcal')}
  else if(t==='custom'){const g=n=>f.elements[n].value;const name=g('name').trim().slice(0,50),unit=g('unit').trim().slice(0,30),kcal=+g('kcal');if(!name||!unit||!(kcal>=0)){toast('Fill name, serving and calories.');return}editProfile(p=>{p.custom=p.custom||[];p.custom.push({id:'c_'+uid(),name,unit,kcal:clamp(kcal,0,3000),p:clamp(+g('p')||0,0,300),c:clamp(+g('c')||0,0,500),f:clamp(+g('f')||0,0,300),d:'v',cat:'Custom'})});S.q=name;render();toast('Custom food saved')}
  else if(t==='meas'){const m={};for(const n of ['waist','chest','hips','arm','thigh']){const v=+f.elements[n].value;if(v>0)m[n]=clamp(r1(v),20,250)}if(!Object.keys(m).length){toast('Enter at least one measurement.');return}editDay(today(),d=>{d.meas=Object.assign(d.meas||{},m)});toast('Measurements saved')}
  else if(t==='chat')chatSend();
});

/* ---------- reminders ticker ---------- */
let lastTick='';
function tickRem(){
  if(!S.profile)return;const now=new Date(),hm=pad(now.getHours())+':'+pad(now.getMinutes());
  if(today()!==S.lastDay){const wasToday=S.sel===S.lastDay;S.lastDay=today();if(wasToday)S.sel=today();S.dismissed.clear();scheduleRender()}
  if(hm===lastTick)return;lastTick=hm;
  const r=(S.profile.rem||[]).find(x=>x.on&&x.time===hm);if(r)toast('Reminder: '+r.label);
}

/* ---------- boot ---------- */
function migrate(){const P=S.profile;if(P&&!P.challengeStart&&!ST.dirty.has('app/profile')){P.challengeStart=today();persist('app/profile')}}
function ready(){S.ready=true;migrate();if(S.profile&&adaptiveCheck(false)){}render();setInterval(tickRem,20000);
  try{if('serviceWorker' in navigator&&window.top===window&&location.protocol==='https:'&&!/claude|anthropic/.test(location.hostname))navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}}
async function boot(){
  const v=location.hash.slice(1);S.view=VIEWS.includes(v)?v:'today';
  render();
  const C=window.claude&&typeof window.claude.use==='function'?window.claude:null;
  if(C){C.use('sample').then(s=>{S.ai=s||null;if(S.ready)scheduleRender()}).catch(()=>{});C.use('downloads').then(d=>{S.dl=d||null}).catch(()=>{})}
  let db=null;try{db=C?await C.use('db'):null}catch(e){db=null}
  if(!db){S.mode='local';localLoad();ready();return}
  ST.db=db;S.mode='db';setSync('loading');
  let gp=false,gd=false;
  const tm=setTimeout(()=>{if(!(gp&&gd)){S.loadNote="Your data can't be reached yet. Check your connection — it will appear as soon as it loads.";render()}},10000);
  const done=()=>{if(S.ready){migrate();scheduleRender();return}if(gp&&gd){clearTimeout(tm);S.loadNote='';setSync('ok');ready()}};
  db.doc('app/profile').onSnapshot(s=>{if(!ST.dirty.has('app/profile')){S.profile=s.exists?Object.assign(DEF(),clone(s.data())):null;S.ver++}if(!s.metadata.fromCache||s.exists)gp=true;done()},e=>{gp=true;S.loadNote='Could not load your profile ('+((e&&e.code)||'error')+').';done()});
  db.collection('days').onSnapshot(q=>{for(const ch of q.docChanges()){const id=ch.doc.id;if(ST.dirty.has('days/'+id))continue;if(ch.type==='removed')delete S.days[id];else S.days[id]=norm(id,clone(ch.doc.data()))}S.ver++;if(!q.metadata.fromCache||q.size)gd=true;done()},e=>{gd=true;S.loadNote='Could not load your log ('+((e&&e.code)||'error')+').';done()});
}
boot();
}
